name: Verify MFC Studio
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python verification dependencies
        run: python3 -m pip install 'lxml==6.1.1'
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/source_safety.py --check
      - run: python3 scripts/build-materials.py
      - run: python3 scripts/build-s02.py
      - run: python3 scripts/audit-s29.py
      - run: python3 scripts/audit-conventional-arms.py --check
      - run: python3 scripts/audit-conventional-methods.py --check
      - run: python3 scripts/audit-external-arms.py --check
      - name: Verify catalogue integrity and report coverage
        run: python3 scripts/build-conventional-catalog.py --check
      - run: python3 scripts/build-corpus.py
      - run: git diff --exit-code --stat -- science/corpus-seed.json science/corpus-embedded-assets.json science/corpus-pdf-assets.json science/materials-processed.json research/materials-v0.1/curation-report.json research/corpus-v0.3/curation-report.json research/corpus-v0.4/S02-processed.json
      - run: node scripts/audit-corpus.mjs /tmp/mfc-corpus-audit.json
      - run: python3 -m unittest discover -s scripts -p 'test_source_safety.py'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: pnpm run check
      - run: pnpm test
      - run: python3 -m unittest discover -s science/legacy-v0.1 -p 'test_*.py'
      - run: python3 -m unittest discover -s research/corpus-v0.2 -p 'test_*.py'
      - run: pnpm run build
